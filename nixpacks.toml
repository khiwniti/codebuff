# Nixpacks configuration for Codebuff deployment
# This configures the build environment for Railway

[phases.setup]
nixPkgs = ["nodejs_20", "bun", "openssl"]

[phases.install]
cmds = ["bun install"]

[phases.build]
cmds = ["bun --cwd web run build"]

[start]
cmd = "cd web && node_modules/.bin/next start -p ${PORT:-3000}"
