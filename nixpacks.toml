# Nixpacks configuration for Codebuff deployment
# This configures the build environment for Railway

[phases.setup]
nixPkgs = ["nodejs_20", "bun", "openssl"]

[phases.install]
cmds = ["bun install"]

[phases.build]
cmds = [
  "bun --cwd packages/internal run db:migrate",
  "bun --cwd web run build"
]

[start]
cmd = "bun --cwd web run start"
